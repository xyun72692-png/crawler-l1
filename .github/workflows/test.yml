name: test

# 目的：让「别人 clone 能不能跑」这件事每次提交都自动回答一次。
# 只跑离线六套 + 基线校验；需要本机抓取产物的 compare / guard 不在 CI 里跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  six-suites:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 行尾正常化（避免 CRLF 影响基线 MD5）
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: 安装依赖（只用 requirements.txt，模拟真实用户）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 环境自检（缺件立刻看出来）
        run: python -c "import requests,bs4,lxml,openpyxl;print('deps ok')"

      - name: test_crawler
        env:
          CRAWLER_TEST_TMP: ${{ runner.temp }}/cases
        run: python tests/test_crawler.py

      - name: test_discover
        run: python tests/test_discover.py

      - name: test_identify
        run: python tests/test_identify.py

      - name: test_transport
        run: python tests/test_transport.py

      - name: test_rule0
        run: python tests/test_rule0.py

      - name: test_render_batch
        run: python tests/test_render_batch.py

      - name: 基线校验（副本完整性 + 源漂移）
        run: python tests/verify_baseline.py --strict --check-source